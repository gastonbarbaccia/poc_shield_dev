# Shield Dev Radar: análisis de seguridad en cada push y pull request.
# Guardar en: .github/workflows/shield-radar.yml
# SHIELD_KEY (y NVD_API_KEY, opcional) van como secretos del repositorio: Settings → Secrets and variables → Actions.
# Cada secreto llega solo al paso que lo usa. Las acciones van fijadas por SHA (la versión, en el comentario).
name: Shield Dev Radar

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  seguridad:
    runs-on: ubuntu-latest
    env:
      SHIELD_URL: https://shield-radar-aio.onrender.com
      SHIELD_WORKSPACE: poc-shield
      SHIELD_TARGET: ${{ github.repository }}
      SHIELD_FAIL_ON: none   # critical | high | medium | low | none
      ZAP_TARGET: https://www.gcbgroup.com.ar   # entorno que analiza ZAP (no producción)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0   # Gitleaks revisa todo el historial de git

      - name: Caché de la base de Trivy
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: ${{ runner.temp }}/trivy-cache   # fuera del repositorio: no se analiza
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      # Trivy y Dependency-Check necesitan el package-lock.json. Solo se genera donde falta, sin descargar ni ejecutar nada.
      - name: Archivos de bloqueo de npm (solo donde falten)
        run: |
          find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*' -not -path './.shield-reports/*' | while IFS= read -r f; do
            d=$(dirname "$f")
            if [ ! -f "$d/package-lock.json" ] && [ ! -f "$d/yarn.lock" ] && [ ! -f "$d/pnpm-lock.yaml" ]; then
              echo "Generando $d/package-lock.json"
              (cd "$d" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund) || echo "No se pudo generar en $d"
            fi
          done

      - name: Semgrep
        run: docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src --entrypoint sh semgrep/semgrep:1.182.0 -c 'mkdir -p .shield-reports && (semgrep scan --config auto --exclude .shield-reports --exclude .dc-data --exclude .trivycache --json --output .shield-reports/semgrep.json || true)'

      - name: Gitleaks
        run: docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src --entrypoint sh zricethezav/gitleaks:v8.30.1 -c 'mkdir -p .shield-reports && gitleaks detect --source . --report-format json --report-path .shield-reports/gitleaks.json --exit-code 0'

      - name: Trivy
        run: mkdir -p "$RUNNER_TEMP/trivy-cache" && docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e TRIVY_CACHE_DIR=/cache -v "$RUNNER_TEMP/trivy-cache:/cache" -v "$PWD:/src" -w /src --entrypoint sh aquasec/trivy:0.76.1 -c 'mkdir -p .shield-reports && trivy fs --scanners vuln,secret,misconfig --skip-dirs .shield-reports --skip-dirs .dc-data --skip-dirs .trivycache --format json --output .shield-reports/trivy.json .'

      - name: Checkov
        run: docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src --entrypoint sh bridgecrew/checkov:3.3.30 -c 'mkdir -p .shield-reports && checkov --directory . --skip-path .shield-reports --skip-path .dc-data --skip-path .trivycache --output json --soft-fail > .shield-reports/checkov.json'

      - name: Caché de la base del NVD (Dependency-Check)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: .dc-data
          key: dependency-check-${{ github.run_id }}
          restore-keys: dependency-check-

      - name: Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # opcional, acelera la primera descarga de la base del NVD
        run: docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e SHIELD_TARGET -e NVD_API_KEY -v "$PWD:/src" -w /src --entrypoint sh owasp/dependency-check:12.1.0 -c 'mkdir -p .shield-reports && /usr/share/dependency-check/bin/dependency-check.sh --scan . --exclude ".dc-data/**" --exclude ".shield-reports/**" --exclude ".trivycache/**" --data .dc-data --format JSON --out .shield-reports --project "$SHIELD_TARGET" ${NVD_API_KEY:+--nvdApiKey "$NVD_API_KEY"} || true'

      - name: Trivy (imágenes)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          mkdir -p .shield-reports/imagenes
          : > .shield-reports/imagenes/lista.txt
          REPO=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          find . -type f \( -name Dockerfile -o -name 'Dockerfile.*' \) -not -path './.git/*' -not -path './.shield-reports/*' | sort | while IFS= read -r DF; do
            SAFE=$(printf '%s' "${DF#./}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g; s/^[.-]*//' | cut -c1-120)
            IMAGE="$REPO:$SAFE"
            echo "=== $IMAGE ($DF)"
            if docker build -f "$DF" -t "$IMAGE" .; then
              docker save "$IMAGE" -o .trivyimg.tar
              docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e TRIVY_CACHE_DIR=/cache -v "$RUNNER_TEMP/trivy-cache:/cache" -v "$PWD:/src" -w /src aquasec/trivy:0.76.1 image --scanners vuln,secret --input .trivyimg.tar --format json --output ".shield-reports/imagenes/$SAFE.json" \
                && echo "$IMAGE $SAFE" >> .shield-reports/imagenes/lista.txt || echo "No se pudo analizar $IMAGE"
              rm -f .trivyimg.tar
            else
              echo "No se pudo construir $DF: se omite"
            fi
          done

      - name: OWASP ZAP
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm -v "$PWD/zap-out:/zap/wrk:rw" zaproxy/zap-stable:2.17.0 zap-baseline.py -t "$ZAP_TARGET" -m 3 -j -J zap-report.json -I || true
          mkdir -p .shield-reports && cp zap-out/zap-report.json .shield-reports/ || true

      - name: Enviar a Shield Dev Radar
        env:
          SHIELD_KEY: ${{ secrets.SHIELD_KEY }}
        run: |
          curl -sfL "$SHIELD_URL/downloads/shield-import.sh" -o shield-import.sh
          echo "617b599971ee2400396f799d6184a856e516b6bf486d0b0b0c13a26ca2544cf4  shield-import.sh" | sha256sum -c -   # se detiene si el script no es el original
          bash shield-import.sh .shield-reports/semgrep.json .shield-reports/gitleaks.json .shield-reports/trivy.json .shield-reports/checkov.json .shield-reports/dependency-check-report.json .shield-reports/zap-report.json
          # Cada imagen, con el nombre de SU imagen como destino (su propio activo)
          if [ -s .shield-reports/imagenes/lista.txt ]; then
            while read -r IMAGE SAFE; do
              if [ -f ".shield-reports/imagenes/$SAFE.json" ]; then
                SHIELD_TARGET="$IMAGE" bash shield-import.sh ".shield-reports/imagenes/$SAFE.json"
              fi
            done < .shield-reports/imagenes/lista.txt
          fi