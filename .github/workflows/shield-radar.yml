# Shield Dev Radar
# SAST + SCA + IaC + Secrets + Containers + DAST

name: Shield Dev Radar

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  seguridad:
    runs-on: ubuntu-latest

    env:
      SHIELD_URL: https://shield-radar-aio.onrender.com
      SHIELD_WORKSPACE: poc-shield
      SHIELD_TARGET: ${{ github.repository }}
      SHIELD_FAIL_ON: none
      ZAP_TARGET: https://www.gcbgroup.com.ar

    steps:

      # CHECKOUT
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      # SEMGREP - SAST
      - name: Semgrep
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/src" \
            -w /src \
            --entrypoint sh \
            semgrep/semgrep:1.182.0 \
            -c 'semgrep scan --config auto --json --output semgrep.json || true'

      # GITLEAKS - SECRET SCANNING
      - name: Gitleaks
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/src" \
            -w /src \
            --entrypoint sh \
            zricethezav/gitleaks:v8.30.1 \
            -c 'gitleaks detect --source . --report-format json --report-path gitleaks.json --exit-code 0'

      # TRIVY - DEPENDENCIES + SECRETS + IaC
      - name: Trivy - Filesystem
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/src" \
            -w /src \
            --entrypoint sh \
            aquasec/trivy:0.76.1 \
            -c 'trivy fs --scanners vuln,secret,misconfig --format json --output trivy.json . || true'


      # DETECTAR DOCKERFILES
      - name: Detectar Dockerfiles
        id: dockerfiles
        run: |
          mkdir -p docker-reports

          COUNT=$(find . \
            -type f \
            \( -name Dockerfile -o -name 'Dockerfile.*' \) \
            -not -path './.git/*' \
            | wc -l)

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          echo "Dockerfiles encontrados: $COUNT"

      # CONSTRUIR IMÁGENES
      - name: Build - Docker Images
        if: steps.dockerfiles.outputs.count != '0'
        run: |
          mkdir -p docker-reports

          touch docker-images.txt

          while IFS= read -r -d '' DOCKERFILE; do

            RELATIVE_PATH="${DOCKERFILE#./}"

            SAFE_NAME=$(echo "$RELATIVE_PATH" \
              | tr '/:' '--' \
              | tr '[:upper:]' '[:lower:]')

            IMAGE="shielddev-radar:${SAFE_NAME}"

            echo ""
            echo "=================================="
            echo "Construyendo: $IMAGE"
            echo "Dockerfile: $DOCKERFILE"
            echo "=================================="

            # Contexto de build: raíz del repositorio.
            if docker build \
              --pull \
              -f "$DOCKERFILE" \
              -t "$IMAGE" \
              .; then

              echo "$IMAGE" >> docker-images.txt
              echo "BUILD OK: $IMAGE"

            else
              echo "BUILD ERROR: $DOCKERFILE"
              echo "$DOCKERFILE" >> docker-reports/build-errors.txt
            fi

          done < <(
            find . \
              -type f \
              \( -name Dockerfile -o -name 'Dockerfile.*' \) \
              -not -path './.git/*' \
              -print0 | sort -z
          )

      # CACHE TRIVY
      - name: Cache Trivy
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ runner.os }}
          restore-keys: |
            trivy-db-

      # ANALIZAR CADA IMAGEN CON TRIVY
      - name: Trivy - Container Images
        if: steps.dockerfiles.outputs.count != '0'
        run: |
          mkdir -p docker-reports
          mkdir -p "$RUNNER_TEMP/trivy-cache"

          if [ ! -s docker-images.txt ]; then
            echo "No hay imágenes construidas para analizar."
            exit 0
          fi

          while IFS= read -r IMAGE; do

            [ -z "$IMAGE" ] && continue

            SAFE_NAME=$(echo "$IMAGE" | tr '/:' '__')
            REPORT="docker-reports/${SAFE_NAME}.json"

            echo ""
            echo "=================================="
            echo "Analizando imagen: $IMAGE"
            echo "=================================="

            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD:/src" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
              aquasec/trivy:0.76.1 \
              image \
                --scanners vuln,secret \
                --format json \
                --output "/src/$REPORT" \
                "$IMAGE" \
              || echo "ERROR analizando $IMAGE"

          done < docker-images.txt


      # CHECKOV - IaC
      - name: Checkov
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/src" \
            -w /src \
            --entrypoint sh \
            bridgecrew/checkov:3.3.30 \
            -c 'checkov --directory . --output json --soft-fail > checkov.json'

      # OWASP ZAP - DAST
      - name: OWASP ZAP
        run: |
          mkdir -p zap-out
          chmod 777 zap-out

          docker run --rm \
            -v "$PWD/zap-out:/zap/wrk:rw" \
            zaproxy/zap-stable:2.17.0 \
            zap-baseline.py \
              -t "$ZAP_TARGET" \
              -J zap-report.json \
              -I || true

          cp zap-out/zap-report.json . || true

      # ENVIAR REPORTES A SHIELD DEV
      - name: Enviar resultados a Shield Dev Radar
        env:
          SHIELD_KEY: ${{ secrets.SHIELD_KEY }}
        run: |
          set -e

          curl -sfL \
            "$SHIELD_URL/downloads/shield-import.sh" \
            -o shield-import.sh

          echo "617b599971ee2400396f799d6184a856e516b6bf486d0b0b0c13a26ca2544cf4  shield-import.sh" \
            | sha256sum -c -

          chmod +x shield-import.sh

          REPORTS=(
            semgrep.json
            gitleaks.json
            trivy.json
            checkov.json
            zap-report.json
          )

          # Agregar los reportes de cada imagen construida.
          while IFS= read -r -d '' REPORT; do
            REPORTS+=("$REPORT")
          done < <(find docker-reports -type f -name '*.json' -print0 | sort -z)

          echo "Reportes que se enviarán:"
          printf '%s\n' "${REPORTS[@]}"

          bash shield-import.sh "${REPORTS[@]}"
```