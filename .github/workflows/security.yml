name: Security Scan

on:
  push:
    branches: [main, dev, staging]
  pull_request:

env:
  GHASCAN_URL: ${{ secrets.GHASCAN_URL }}
  GHASCAN_API_KEY: ${{ secrets.GHASCAN_API_KEY }}
  APP_URL: ${{ secrets.APP_URL }}   # sólo lo usa el job de ZAP (DAST)

jobs:
  gitleaks:
    name: GitLeaks — Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-git \
            --report-format json --report-path /repo/gitleaks-report.json

      - name: Importar a ghascan
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GHASCAN_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @gitleaks-report.json \
            "$GHASCAN_URL/api/projects/import?repo_url=https://github.com/${{ github.repository }}&branch=${{ github.ref_name }}&format=gitleaks"

  trivy:
    name: Trivy — Dependencias/Imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t app-image:${{ github.sha }} .

      - name: Run Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: app-image:${{ github.sha }}
          format: json
          output: trivy-report.json
          exit-code: 0
          vuln-type: os,library

      - name: Importar a ghascan
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GHASCAN_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @trivy-report.json \
            "$GHASCAN_URL/api/projects/import?repo_url=https://github.com/${{ github.repository }}&branch=${{ github.ref_name }}&format=trivy"

  depcheck:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Dependency-Check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ github.repository }}
          path: .
          format: JSON
          out: .

      - name: Importar a ghascan
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GHASCAN_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @dependency-check-report.json \
            "$GHASCAN_URL/api/projects/import?repo_url=https://github.com/${{ github.repository }}&branch=${{ github.ref_name }}&format=dependency-check"

  semgrep:
    name: Semgrep — SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep --config=auto --json --output=semgrep-report.json . || true

      - name: Importar a ghascan
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GHASCAN_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @semgrep-report.json \
            "$GHASCAN_URL/api/projects/import?repo_url=https://github.com/${{ github.repository }}&branch=${{ github.ref_name }}&format=semgrep"

  opengrep:
    name: Opengrep — SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Opengrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          echo "$HOME/.opengrep/cli/latest" >> $GITHUB_PATH

      - name: Run Opengrep
        continue-on-error: true
        run: |
          opengrep scan \
            --config auto \
            --json \
            --output opengrep-results.json \
            .

      - name: Importar a ghascan
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GHASCAN_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @opengrep-results.json \
            "$GHASCAN_URL/api/projects/import?repo_url=https://github.com/${{ github.repository }}&branch=${{ github.ref_name }}&format=opengrep"

  checkov:
    name: Checkov — IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        continue-on-error: true
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          output_format: json
          output_file_path: checkov-output
          soft_fail: true

      - name: Normalizar reporte
        if: always()
        run: |
          if sudo test -f checkov-output/results_json.json; then
            sudo mv checkov-output/results_json.json checkov-report.json
            sudo chown "$USER" checkov-report.json
          fi

      - name: Importar a ghascan
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GHASCAN_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @checkov-report.json \
            "$GHASCAN_URL/api/projects/import?repo_url=https://github.com/${{ github.repository }}&branch=${{ github.ref_name }}&format=checkov"

  owasp-zap:
    name: OWASP ZAP — DAST
    runs-on: ubuntu-latest
    steps:
      - name: Run OWASP ZAP
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/zap/wrk/:rw" -t zaproxy/zap-stable \
            zap-baseline.py -t "$APP_URL" -J zap-report.json -I

      - name: Importar a ghascan
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GHASCAN_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @report/zap-report.json \
            "$GHASCAN_URL/api/projects/${{ vars.GHASCAN_DAST_PROJECT_ID }}/targets/${{ vars.GHASCAN_DAST_TARGET_ID }}/import?format=zap"
